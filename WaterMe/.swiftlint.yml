disabled_rules:
    - opening_brace
    - colon
    - trailing_whitespace
    - identifier_name
    - type_name
    - line_length

opt_in_rules:
  - vertical_whitespace
  - operator_usage_whitespace

# configurable rules can be customized from this configuration file
# binary rules can set their severity level

force_cast: warning
force_try: warning

large_tuple:
    warning: 4
    error: 10
trailing_comma:
    mandatory_comma: false
excluded:
  - Pods
  - GitSubmodules
  - Frameworks/Datum/DatumTests
  - Frameworks/Store/StoreTests
  - Frameworks/Calculate/CalculateTests
  - Frameworks/Calculate/Calculate/PrivateKeys.swift
